name: Bug
description: Something in mlab is broken or wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened. Paste the traceback or wrong output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`bash mlab doctor` output"
      description: Remove anything that looks like a credential before pasting.
      render: text
    validations:
      required: true
