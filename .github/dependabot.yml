# Weekly dependency and GitHub Actions updates. Security updates arrive as soon as an advisory lands
# (needs "Dependabot security updates" on under Settings > Code security).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # IG's Lightstreamer Server is 7.3.3; client 2.x needs 7.4+. Lift when IG upgrades.
      - dependency-name: lightstreamer-client-lib
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
