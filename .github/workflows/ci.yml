name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (rule floor in pyproject.toml; see docs/wiki/Design-Standards.md)
        run: ruff check src tests
      - name: Test (offline; tests/conftest.py points MLAB_DATA_DIR at a temp dir)
        run: pytest -q
