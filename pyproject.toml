[project]
name = "mlab"
version = "0.1.0"
description = "Market Lab: market data, technical analysis, due diligence and IG (read-only) toolkit for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.0.6",
  "numpy>=2.4.6",
  "pyarrow>=25.0.1",
  "requests>=2.34.2",
  "yfinance>=1.7.0",
  "plotly>=7.1.0",
  "matplotlib>=3.11.2",
  "scipy>=1.17.1",
  "statsmodels>=0.15.0",
  "tabulate>=0.10.0",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
stream = ["lightstreamer-client-lib>=2.2.3"]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]

[project.scripts]
mlab = "mlab.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# The floor CI enforces (docs/wiki/Design-Standards.md). Raise it as the codebase is cleaned up, never lower it.
select = ["F", "E4", "E7", "E9", "B", "UP", "I", "S110", "S112"]
ignore = [
  "E702",  # one-line statements in argparse blocks
  "E731",  # named lambdas in small local helpers
  "E741",  # l for low, as in OHLC
  "B023",  # loop-variable closures here are all called inside the loop
  "B905",  # zip(strict=) to be added module by module
]

[tool.ruff.lint.per-file-ignores]
"src/mlab/providers/ig.py" = ["I001", "UP017"]  # streaming imports change in the open streaming PR; sort after it lands
"tests/*" = ["E721"]  # (df.dtypes == bool) is the pandas idiom, not a type comparison
