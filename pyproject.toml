[project]
name = "mlab"
version = "0.1.0"
description = "Market Lab: market data, technical analysis, due diligence and IG (read-only) toolkit for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.0.6",
  "numpy>=2.4.6",
  "pyarrow>=25.0.1",
  "requests>=2.34.2",
  "yfinance>=1.7.0",
  "plotly>=7.1.0",
  "matplotlib>=3.11.2",
  "scipy>=1.17.1",
  "statsmodels>=0.15.0",
  "tabulate>=0.10.0",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
stream = ["lightstreamer-client-lib>=2.2.3"]
dev = ["pytest>=9.1.1"]

[project.scripts]
mlab = "mlab.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
