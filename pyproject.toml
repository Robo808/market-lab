[project]
name = "mlab"
version = "0.1.0"
description = "Market Lab: market data, technical analysis, due diligence and IG (read-only) toolkit for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=23.0.1",
  "requests>=2.33.0",
  "yfinance>=0.2.50",
  "plotly>=5.20",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "tabulate>=0.9",
  "openpyxl>=3.1",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
stream = ["lightstreamer-client-lib>=2.0"]
dev = ["pytest>=9.0.3"]

[project.scripts]
mlab = "mlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
