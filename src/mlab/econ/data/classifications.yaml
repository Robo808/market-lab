# Sector-level crosswalk, NAICS -> ISIC section (approximate, many-to-many). UK SIC 2007 sections use the
# same letters as ISIC Rev.4, so cls:uksic:<L> is mapped one-to-one to cls:isic:<L> by the loader.
crosswalk:
  naics_to_isic:
    "11": [A]
    "21": [B]
    "22": [D, E]
    "23": [F]
    "31-33": [C]
    "42": [G]
    "44-45": [G]
    "48-49": [H]
    "51": [J]
    "52": [K]
    "53": [L]
    "54": [M]
    "55": [M]
    "56": [N, E]
    "61": [P]
    "62": [Q]
    "71": [R]
    "72": [I]
    "81": [S]
    "92": [O]
