# Classification systems the graph is keyed on. Open standards only (GICS is licensed by MSCI / S&P and is
# deliberately left out). Section- and sector-level codes are listed here; finer codes live on each industry
# node in industries.yaml. Crosswalks at this level are approximate (many-to-many): use the official
# concordance files (see `docs`) when a 6-digit match matters.
#
# Node ids: cls:<system>:<code>, e.g. cls:naics:44-45, cls:isic:G, cls:hs:6907.

systems:
  naics:
    name: North American Industry Classification System 2022
    publisher: US Census Bureau
    docs: https://www.census.gov/naics/
    concordances: https://www.census.gov/naics/?68967  # NAICS <-> ISIC Rev.4 concordance files
  isic:
    name: International Standard Industrial Classification Rev.4
    publisher: UN Statistics Division
    docs: https://unstats.un.org/unsd/classifications/Econ/isic
    note: ISIC Rev.5 was adopted in 2023; national statistics still publish on Rev.4 / NACE Rev.2 bases.
  uksic:
    name: UK Standard Industrial Classification 2007
    publisher: Office for National Statistics
    docs: https://www.ons.gov.uk/methodology/classificationsandstandards/ukstandardindustrialclassificationofeconomicactivities
    note: Built on NACE Rev.2, which shares ISIC Rev.4 section letters.
  coicop:
    name: Classification of Individual Consumption According to Purpose (COICOP 1999 as used in UK and EU national accounts; COICOP 2018 adopted by UNSD)
    publisher: UN Statistics Division
    docs: https://unstats.un.org/unsd/classifications/Econ/coicop
  hs:
    name: Harmonized System (goods nomenclature, 6-digit international level)
    publisher: World Customs Organization
    docs: https://www.wcoomd.org/en/topics/nomenclature/overview.aspx
    lookup: https://www.trade-tariff.service.gov.uk/  # UK tariff (8/10-digit) built on HS; free API

