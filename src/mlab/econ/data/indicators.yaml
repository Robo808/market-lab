# The dictionary: every number we track, macro to micro. One entry per economic concept and geography;
# the same concept from several publishers is one entry with several `series` (that is what "sideways"
# traversal walks). Fields:
#
#   name       what the number is
#   layer      macro (whole economy) | meso (sector / product line) | micro (company or transaction level)
#   themes     tags used for grouping and feature selection
#   geo        US | UK | EA | GLOBAL | CN ...
#   freq       D | W | M | Q | A
#   unit       as published
#   cycle      leading | coincident | lagging | target (a label to model, not a feature)
#   industries ind:<key> nodes this number measures (creates `measures` edges)
#   series     where to get it: {source, id, dataset?, via?, note?}; `via: fred` means FRED mirrors the
#              original publisher (fetch from FRED, freeze from the publisher: FRED's terms forbid storage)
#   transform  ML feature hints: level, yoy, mom, diff, log, z
#   release_lag_months  optional: months between the end of the reference period and publication; the
#              panel shifts by it (defaults by freq: D/W 0, M 2, Q 3, A 6, conservative on purpose)
#
# Series ids are checked live with `mlab econ check` (FRED, ONS, Trade Tariff); the result is not stored
# here. A `note: unverified` means the id is written from the publisher's catalogue and has not passed a
# live check yet.

# ======================================================================================================
