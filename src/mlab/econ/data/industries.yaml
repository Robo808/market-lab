# Industry tree: sector -> industry -> niche line. Each node carries its codes in every open system so a
# walk can jump between US (NAICS), international (ISIC Rev.4 division) and UK (UK SIC 2007 class) data,
# plus the consumer (COICOP) and goods-trade (HS) codes where the industry sells to households or ships goods.
#
#   parent        tree edge (child_of); null = top of a branch under the economy root
#   naics         NAICS 2022 codes (2 to 6 digits)
#   isic          ISIC Rev.4 divisions (2 digits) or sections (letter)
#   uksic         UK SIC 2007 classes (NN.NN) or sections
#   coicop / hs   see classifications.yaml
#   cycle         sensitivity to the business cycle: deep | high | medium | low | defensive
#   drivers       free-text demand / cost drivers; the typed links live in edges.yaml
#
# Node ids: ind:<key>. Codes are written from the classification manuals; check a 6-digit or 4-digit code
# against the official file before relying on it in a filter (see classifications.yaml `docs`).

economy:
  name: Whole economy
  parent: null
  cycle: high

