# Tradable proxies: where an industry node meets a price. Each instrument creates a `proxies` edge to
# the industries it is exposed to, and `discloses` edges to the unit-economics KPIs its results usually
# carry (check the latest filing: disclosure sets change). Tickers are Yahoo symbols (London listings end
# in .L and are quoted in pence); all of them returned prices from Yahoo on 2026-10-16.
#
# Node ids: mkt:<key>. The same listed share can be held through a broker, an ISA, or a spread bet / CFD
# venue; the venue choice belongs to the trade, not to this file.

